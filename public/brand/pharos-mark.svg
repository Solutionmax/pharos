<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pharos">
  <title>Pharos</title>
  <!-- Two beams from the lamp. One pair only: a second, fainter pair turned to mush at 16px. -->
  <g fill="currentColor" opacity=".32">
    <path d="M32 17 L2 8 L2 15 L32 23 Z"/>
    <path d="M32 17 L62 8 L62 15 L32 23 Z"/>
  </g>
  <!-- The lamp. The only colour that is not the wearer's: it is the light, and the light is the product. -->
  <rect x="27" y="14" width="10" height="9" rx="2" fill="#F5A623"/>
  <g fill="currentColor">
    <!-- Lamp-room frame, gallery, tower and base: one mass, so it still reads as a tower at favicon size. -->
    <path d="M25 11 h14 a2 2 0 0 1 2 2 v11 h-18 v-11 a2 2 0 0 1 2 -2 z M27 14 v8 h10 v-8 z"/>
    <rect x="21" y="25" width="22" height="3.5" rx="1"/>
    <path d="M26 30 h12 l4.5 22 h-21 Z"/>
    <rect x="15" y="53" width="34" height="6" rx="1.5"/>
  </g>
</svg>
