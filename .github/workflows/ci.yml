name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Pint · PHPStan · PHPUnit · audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sodium, sqlite3, pdo_sqlite, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Formatting (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan, level 5)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Tests (PHPUnit)
        run: php artisan test --compact

      - name: Dependency advisories
        run: composer audit
