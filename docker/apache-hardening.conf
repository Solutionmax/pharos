# Loaded by the Dockerfile as conf-enabled/zz-pharos-hardening.conf: after
# Debian's security.conf, whose ServerTokens OS would otherwise win.

# The server names itself as Apache and nothing more (PHP's own banner is
# switched off with expose_php in the image).
ServerTokens Prod
ServerSignature Off

# Dotfiles are never served: .htaccess, storage/.gitignore and anything a
# deploy leaves behind. .well-known stays reachable: ACME challenges, and
# security.txt, which Pharos answers itself (Apache sees ".well-known" as the
# file name while that folder does not exist, so the file rule must skip it).
<FilesMatch "^\.(?!well-known$)">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.(?!well-known(/|$))">
    Require all denied
</DirectoryMatch>
